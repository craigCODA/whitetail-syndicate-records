name: Hours and payments trial

"on":
  push:
    branches: [trial/hours-payments]
    paths:
      - records/billing/**
      - scripts/billing.py
      - scripts/record_material.py
      - scripts/refresh_inventory.py
      - scripts/validate_records.py
      - tests/**
      - .github/workflows/hours-payments-trial.yml

permissions:
  contents: write

concurrency:
  group: hours-payments-trial
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/trial/hours-payments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: trial/hours-payments
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test calculations and ledger workflow
        run: python3 -m unittest discover -s tests -v
      - name: Refresh and validate records
        run: python3 scripts/billing.py refresh
      - name: Display the current report
        run: cat records/billing/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save generated records to the trial branch
        run: |
          git add records/billing/ledger.json records/billing/summary.json records/billing/summary.md records/materials.json records/activity.jsonl records/file-inventory.json records/material-directory.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh hours and payments trial report"
          git push origin HEAD:refs/heads/trial/hours-payments
